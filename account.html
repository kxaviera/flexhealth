<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Flex Health</title>
  <meta name="description" content="Manage your Flex Health account — orders, profile, wishlist and reviews.">
  <link rel="stylesheet" href="css/styles.css?v=20260728t">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
</head>
<body class="account-page-body">

  <div id="site-header"></div>

  <header class="account-header">
    <div class="container">
      <nav class="account-breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span class="account-breadcrumb__sep">/</span>
        <span>My Account</span>
      </nav>
      <div class="account-header__row">
        <div>
          <h1 id="account-page-title">Dashboard</h1>
          <p id="account-welcome" class="account-header__sub">Loading…</p>
        </div>
        <a href="shop.html" class="btn btn--outline btn--sm">Continue Shopping</a>
      </div>
    </div>
  </header>

  <section class="account-page">
    <div class="container account-layout">
      <aside class="account-sidebar">
        <div id="account-user-card" class="account-user-card"></div>
        <nav class="account-nav" id="account-nav" aria-label="Account navigation">
          <button type="button" class="account-nav__item active" data-tab="dashboard">
            <svg class="account-nav__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Dashboard
          </button>
          <button type="button" class="account-nav__item" data-tab="orders">
            <svg class="account-nav__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            Orders
          </button>
          <button type="button" class="account-nav__item" data-tab="wishlist">
            <svg class="account-nav__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            Wishlist
          </button>
          <button type="button" class="account-nav__item" data-tab="reviews">
            <svg class="account-nav__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            Reviews
          </button>
          <button type="button" class="account-nav__item" data-tab="profile">
            <svg class="account-nav__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Profile
          </button>
          <button type="button" class="account-nav__item account-nav__item--logout" onclick="FlexHealth.logout()">Sign Out</button>
        </nav>
      </aside>
      <main class="account-main" id="account-content"></main>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/main.js?v=20260728t"></script>
  <script src="js/api.js?v=20260728t"></script>
</body>
</html>
