<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Health — Mobile Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(5, 150, 105, 0.12), transparent 45%),
        radial-gradient(ellipse at 80% 80%, rgba(15, 23, 42, 0.08), transparent 40%),
        #f3f4f6;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: #111827;
      padding: 24px;
    }
    .label {
      text-align: center;
    }
    .label h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    .label h1 span { color: #059669; }
    .label p {
      margin-top: 6px;
      font-size: 13px;
      color: #6b7280;
    }
    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      max-height: calc(100vh - 100px);
      background: #0f172a;
      border-radius: 44px;
      padding: 12px;
      box-shadow:
        0 0 0 2px #1e293b,
        0 25px 60px rgba(0, 0, 0, 0.28),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #0f172a;
      border-radius: 20px;
      z-index: 3;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    .screen {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 34px;
      background: #fff;
      overflow: hidden;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .actions a, .actions button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
    .primary {
      background: #059669;
      color: #fff;
    }
    .ghost {
      background: #fff;
      color: #111827;
      border: 1px solid #d1d5db !important;
    }
    @media (max-width: 440px) {
      .phone {
        width: 100%;
        height: 85vh;
        border-radius: 28px;
        padding: 8px;
      }
      .screen { border-radius: 22px; }
      .phone::before { width: 90px; height: 22px; top: 12px; }
    }
  </style>
</head>
<body>
  <div class="label">
    <h1>Flex <span>Health</span> · Mobile Frame</h1>
    <p>App preview inside phone frame · http://127.0.0.1:8080</p>
  </div>

  <div class="phone">
    <iframe
      class="screen"
      id="app"
      src="http://127.0.0.1:8080"
      title="Flex Health App"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </div>

  <div class="actions">
    <button class="ghost" type="button" onclick="document.getElementById('app').src = document.getElementById('app').src">Reload App</button>
    <a class="primary" href="http://127.0.0.1:8080" target="_blank" rel="noopener">Open Fullscreen</a>
  </div>
</body>
</html>
