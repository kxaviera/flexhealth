<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Health — Mobile Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(5, 150, 105, 0.12), transparent 45%),
        #f3f4f6;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: #111827;
      padding: 20px;
    }
    .label { text-align: center; }
    .label h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; }
    .label h1 span { color: #059669; }
    .label p { margin-top: 6px; font-size: 13px; color: #6b7280; }
    .phone {
      position: relative;
      width: 390px;
      height: min(844px, calc(100vh - 110px));
      background: #0f172a;
      border-radius: 44px;
      padding: 12px;
      box-shadow:
        0 0 0 2px #1e293b,
        0 25px 60px rgba(0, 0, 0, 0.28);
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #0f172a;
      border-radius: 20px;
      z-index: 3;
    }
    .screen {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 34px;
      background: #fff;
    }
    .actions { display: flex; gap: 10px; }
    .actions a {
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      background: #059669;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="label">
    <h1>Flex <span>Health</span> · Mobile Frame</h1>
    <p>Same-origin preview (fixes Content Blocked)</p>
  </div>
  <div class="phone">
    <!-- Same origin as Flutter app — avoids X-Frame-Options block -->
    <iframe class="screen" src="./index.html" title="Flex Health"></iframe>
  </div>
  <div class="actions">
    <a href="./index.html" target="_blank" rel="noopener">Open Fullscreen</a>
  </div>
</body>
</html>
